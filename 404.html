<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WeatherNow has moved</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://react-acko-weather-app.vercel.app/" />
    <meta http-equiv="refresh" content="0; url=https://react-acko-weather-app.vercel.app/" />
    <script>
      // Map old HashRouter links (e.g. #/weather-forecast) to the new clean routes.
      var routes = { '/weather-forecast': '/weather', '/about': '/about', '/privacy': '/privacy' }
      var path = (location.hash || '').replace(/^#/, '')
      location.replace('https://react-acko-weather-app.vercel.app' + (routes[path] || '/'))
    </script>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; color: #1f2937; background: #f7f9fc; }
      @media (prefers-color-scheme: dark) { body { color: #e5e7eb; background: #141821; } a { color: #7cc4ef; } }
    </style>
  </head>
  <body>
    <p>WeatherNow has moved to <a href="https://react-acko-weather-app.vercel.app/">react-acko-weather-app.vercel.app</a>.</p>
  </body>
</html>
